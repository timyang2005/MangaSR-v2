name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK_VERSION: '27.0.12077973'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Check NCNN library
        run: |
          echo "=== NCNN Library Status ==="
          ls -la core/superresolution/src/main/cpp/ncnn/lib/
          ls -la core/superresolution/src/main/cpp/ncnn/include/
          echo "=== Models Status ==="
          ls -la core/superresolution/src/main/assets/models/

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          ./gradlew clean
          ./gradlew assemble${{ inputs.build_type || 'debug' }} --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 5

      - name: Check APK output
        id: check-apk
        run: |
          echo "=== APK Output ==="
          find . -name "*.apk" -type f 2>/dev/null
          if [ -f app/build/outputs/apk/${{ inputs.build_type || 'debug' }}/app-${{ inputs.build_type || 'debug' }}.apk" ]; then
            APK_SIZE=$(du -h app/build/outputs/apk/${{ inputs.build_type || 'debug' }}/app-${{ inputs.build_type || 'debug' }}.apk | cut -f1)
            echo "APK found: app/build/outputs/apk/${{ inputs.build_type || 'debug' }}/app-${{ inputs.build_type || 'debug' }}.apk ($APK_SIZE)"
            echo "apk_path=app/build/outputs/apk/${{ inputs.build_type || 'debug' }}/app-${{ inputs.build_type || 'debug' }}.apk" >> $GITHUB_OUTPUT
            echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          else
            echo "ERROR: APK not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manga-sr-${{ inputs.build_type || 'debug' }}-apk
          path: ${{ steps.check-apk.outputs.apk_path }}
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-ci
          release_name: MangaSR v2.0.0 CI Build
          draft: true
          prerelease: false
          files: |
            ${{ steps.check-apk.outputs.apk_path }}
          body: |
            ## MangaSR v2 - CI Build
            
            **APK Size**: ${{ steps.check-apk.outputs.apk_size }}
            
            ### Built with:
            - Java ${{ env.JAVA_VERSION }}
            - Android SDK ${{ env.ANDROID_COMPILE_SDK }}
            - NDK ${{ env.ANDROID_NDK_VERSION }}
            
            ### Features:
            - 5 AI Super-Resolution Models (Real-CUGAN + Real-ESRGAN)
            - NCNN Vulkan GPU Acceleration
            - Intelligent Preloading
            - B&W Manga Optimization
            - SR Status Indicator
            
            ### Build Info:
            - Commit: ${{ github.sha }}
            - Workflow: ${{ github.workflow }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
