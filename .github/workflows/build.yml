name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false'
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" --sdk_root=$ANDROID_HOME 2>/dev/null || true
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_HOME 2>/dev/null || true
          echo "Android SDK setup complete"
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms directory - trying alternate SDK location"
          # Fallback: use android-actions if SDK not found
          if [ ! -d "$ANDROID_HOME/platforms" ]; then
            echo "SDK not found at standard path, checking alternatives..."
            ls -la /opt/android-sdk/ 2>/dev/null && echo "Found at /opt/android-sdk" || true
            ls -la /usr/local/lib/android/ 2>/dev/null || echo "No Android SDK directory found"
          fi

      - name: Download NCNN Vulkan library
        run: |
          set -e
          NCNN_VERSION="20260112"
          NCNN_DIR="core/superresolution/src/main/cpp/ncnn"
          
          echo "Removing old NCNN files..."
          rm -rf ${NCNN_DIR}
          
          echo "Downloading NCNN ${NCNN_VERSION} Vulkan Android library..."
          mkdir -p ${NCNN_DIR}
          
          curl -L -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://github.com/nihui/ncnn/releases/download/${NCNN_VERSION}/ncnn-${NCNN_VERSION}-android-vulkan.zip" \
            -o "/tmp/ncnn-${NCNN_VERSION}.zip"
          
          if [ -f "/tmp/ncnn-${NCNN_VERSION}.zip" ]; then
            echo "Downloaded successfully"
            mkdir -p /tmp/_ncnn_extract
            unzip -q "/tmp/ncnn-${NCNN_VERSION}.zip" -d "/tmp/_ncnn_extract"
            
            # Find the extracted ncnn directory (e.g., ncnn-20260112-android-vulkan)
            NCNN_EXTRACTED=$(find /tmp/_ncnn_extract -maxdepth 2 -type d -name "ncnn-*-android-vulkan" | head -n 1)
            echo "Extracted to: ${NCNN_EXTRACTED}"
            
            if [ -z "${NCNN_EXTRACTED}" ]; then
              echo "ERROR: Could not find extracted ncnn directory"
              ls -la /tmp/_ncnn_extract/
              exit 1
            fi
            
            # Copy contents, stripping the outer version directory
            # e.g., ncnn-20260112-android-vulkan/arm64-v8a/lib/libncnn.a → ncnn/arm64-v8a/lib/libncnn.a
            cp -r "${NCNN_EXTRACTED}"/* "${NCNN_DIR}/"
            
            echo "=== NCNN library structure ==="
            ls -la ${NCNN_DIR}/
            find ${NCNN_DIR} -type f -name "*.a"
            
            rm -rf /tmp/_ncnn_extract /tmp/ncnn-${NCNN_VERSION}.zip
          else
            echo "Failed to download NCNN"
            exit 1
          fi
          
          # Download ncnn headers from source tarball (prebuilt package does not include headers)
          echo "Downloading ncnn headers from source tarball..."
          curl -sL "https://github.com/nihui/ncnn/archive/refs/tags/${NCNN_VERSION}.tar.gz" \
            -o "/tmp/ncnn-headers.tar.gz"
          if [ -f "/tmp/ncnn-headers.tar.gz" ]; then
            echo "ncnn source tarball downloaded, extracting headers..."
            rm -rf /tmp/_ncnn_headers_extract
            mkdir -p /tmp/_ncnn_headers_extract
            tar -xzf "/tmp/ncnn-headers.tar.gz" -C "/tmp/_ncnn_headers_extract"
            HEADER_DIR=$(find /tmp/_ncnn_headers_extract -maxdepth 2 -type d -name "ncnn-${NCNN_VERSION}" | head -n 1)
            if [ -n "${HEADER_DIR}" ]; then
              echo "Headers found at: ${HEADER_DIR}"
              echo "Source directory structure:"
              ls -la ${HEADER_DIR}/
              ls -la ${HEADER_DIR}/src/ 2>/dev/null | head -20 || echo "No src/ directory"
              # ncnn source places headers in src/ directory (not include/ncnn/)
              mkdir -p "${NCNN_DIR}/include/ncnn"
              cp -v ${HEADER_DIR}/src/*.h "${NCNN_DIR}/include/ncnn/" 2>/dev/null || true
              echo "=== Copied headers ==="
              find ${NCNN_DIR}/include -name "*.h" | head -20
              # Verify key headers exist
              if [ -f "${NCNN_DIR}/include/ncnn/net.h" ]; then
                echo "SUCCESS: net.h found"
              else
                echo "WARNING: net.h missing, listing src/ .h files:"
                ls ${HEADER_DIR}/src/*.h 2>/dev/null | head -20 || echo "No .h files in src/"
                ls -la ${HEADER_DIR}/src/ 2>/dev/null | head -20
                echo "Debug: listing all directories"
                ls -d ${HEADER_DIR}/*/
                exit 1
              fi
            else
              echo "ERROR: Could not find ncnn source directory in tarball"
              ls -la /tmp/_ncnn_headers_extract/
              exit 1
            fi
            rm -rf /tmp/ncnn-headers.tar.gz /tmp/_ncnn_headers_extract
          else
            echo "ERROR: Failed to download ncnn source tarball"
            exit 1
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew clean assemble${{ env.BUILD_TYPE }} --no-daemon --info 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          
          echo "=== Build output ==="
          tail -500 build.log
          
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::Build failed with exit code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi
      
      - name: Find APK
        if: success()
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not found!"
            ls -laR app/build 2>/dev/null || true
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"
      
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manga-sr-${{ env.BUILD_TYPE }}-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-ci-${{ github.run_id }}
          release_name: MangaSR v2.0.0 CI Build #${{ github.run_id }}
          draft: false
          prerelease: true
          files: ${{ steps.find_apk.outputs.apk_path }}
          body: |
            ## MangaSR v2 - CI Build

            **APK Size**: ${{ steps.find_apk.outputs.apk_size }}

            ### Build Info:
            - Commit: ${{ github.sha }}
            - Run ID: ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
