name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  ANDROID_SDK_ROOT: /opt/android-sdk
  ANDROID_NDK_HOME: /opt/android-sdk/ndk/27.0.12077973
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false'
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 37

      - name: Setup Android NDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" 2>/dev/null || true
          if [ -d "$ANDROID_SDK_ROOT/ndk/27.0.12077973" ]; then
            echo "NDK 27.0.12077973 already installed"
          else
            echo "Installing NDK..."
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" || echo "NDK install may have failed"
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Check NCNN library
        run: |
          echo "=== NCNN Library Status ==="
          find . -path "*ncnn/lib*" -name "*.a" -o -path "*ncnn/lib*" -name "*.so" 2>/dev/null | head -20 || echo "NCNN lib search..."
          ls -la core/superresolution/src/main/cpp/ncnn/ 2>/dev/null || echo "NCNN dir not found"
          echo "=== Models Status ==="
          ls -la core/superresolution/src/main/assets/models/ 2>/dev/null || echo "Models dir not found"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew clean assemble${{ env.BUILD_TYPE }} --no-daemon --stacktrace 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "=========================================="
            echo "BUILD FAILED with exit code: $BUILD_EXIT_CODE"
            echo "=========================================="
            echo ""
            echo "=== Last 300 lines of build log ==="
            tail -300 build.log
            echo ""
            echo "=== Looking for compilation errors ==="
            grep -E "^e:|^Error:|FAILED|Kotlin.*error" build.log | head -100 || true
            echo ""
            echo "=== CMake/NDK errors ==="
            grep -E "CMake|NDK|native|C\+\+" build.log | head -50 || true
            exit $BUILD_EXIT_CODE
          fi
          echo "BUILD SUCCESSFUL"

      - name: Debug build output
        if: always()
        run: |
          echo "=== Build Directory Structure ==="
          find app/build -type d 2>/dev/null | head -30 || echo "No build directory"
          echo ""
          echo "=== APK Files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo ""
          echo "=== outputs directory ==="
          ls -laR app/build/outputs/ 2>/dev/null || echo "No outputs directory"

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.BUILD_TYPE }}-${{ github.run_number }}
          path: build.log
          retention-days: 30

      - name: Find APK
        id: find-apk
        if: success()
        run: |
          echo "=== Finding APK ==="
          APK_PATH=""
          for variant in "${{ env.BUILD_TYPE }}" debug release; do
            for path in \
              "app/build/outputs/apk/${variant}/app-${variant}.apk" \
              "app/build/outputs/apk/${variant}/app-${variant}-unsigned.apk" \
              "app/build/outputs/apk/${variant}/universal/app-universal.apk"; do
              if [ -f "$path" ]; then
                echo "Found APK at: $path"
                APK_PATH="$path"
                break 2
              fi
            done
          done
          
          echo ""
          echo "All APKs found:"
          find app/build -name "*.apk" -type f 2>/dev/null
          
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "APK Size: $APK_SIZE"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manga-sr-${{ env.BUILD_TYPE }}-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30

      - name: Create Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-ci
          release_name: MangaSR v2.0.0 CI Build
          draft: false
          prerelease: false
          files: |
            ${{ steps.find-apk.outputs.apk_path }}
          body: |
            ## MangaSR v2 - CI Build

            **APK Size**: ${{ steps.find-apk.outputs.apk_size }}

            ### Built with:
            - Java ${{ env.JAVA_VERSION }}
            - Android SDK 37
            - NDK 27.0.12077973

            ### Features:
            - 5 AI Super-Resolution Models (Real-CUGAN + Real-ESRGAN)
            - NCNN Vulkan GPU Acceleration
            - Intelligent Preloading
            - B&W Manga Optimization
            - SR Status Indicator

            ### Build Info:
            - Commit: ${{ github.sha }}
            - Workflow: ${{ github.workflow }}
            - Run: #${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
