name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK_VERSION: '27.0.12077973'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false'
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Check NCNN library
        run: |
          echo "=== NCNN Library Status ==="
          ls -la core/superresolution/src/main/cpp/ncnn/lib/ || echo "NCNN lib not found"
          ls -la core/superresolution/src/main/cpp/ncnn/include/ || echo "NCNN include not found"
          echo "=== Models Status ==="
          ls -la core/superresolution/src/main/assets/models/ || echo "Models not found"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          ./gradlew clean assemble${{ env.BUILD_TYPE }} --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "BUILD FAILED - checking for errors"
            tail -100 build.log
            exit 1
          }

      - name: Debug build output
        run: |
          echo "=== Build Directory Structure ==="
          find app/build -type d 2>/dev/null | head -30 || echo "No build directory"
          echo ""
          echo "=== APK Files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo ""
          echo "=== outputs directory ==="
          ls -laR app/build/outputs/ 2>/dev/null || echo "No outputs directory"

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.BUILD_TYPE }}
          path: build.log
          retention-days: 5

      - name: Find and Copy APK
        id: find-apk
        run: |
          echo "=== Finding APK ==="
          # Try different possible APK locations
          APK_PATH=""
          for variant in "${{ env.BUILD_TYPE }}" debug release; do
            for path in \
              "app/build/outputs/apk/${variant}/app-${variant}.apk" \
              "app/build/outputs/apk/${variant}/app-${variant}-unsigned.apk" \
              "app/build/outputs/apk/${variant}/mihon-${variant}.apk"; do
              if [ -f "$path" ]; then
                echo "Found APK at: $path"
                APK_PATH="$path"
                break 2
              fi
            done
          done
          
          # List all APKs in build directory
          echo ""
          echo "All APKs found:"
          find app/build -name "*.apk" -type f 2>/dev/null
          
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "APK Size: $APK_SIZE"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manga-sr-${{ env.BUILD_TYPE }}-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-ci
          release_name: MangaSR v2.0.0 CI Build
          draft: true
          prerelease: false
          files: |
            ${{ steps.find-apk.outputs.apk_path }}
          body: |
            ## MangaSR v2 - CI Build

            **APK Size**: ${{ steps.find-apk.outputs.apk_size }}

            ### Built with:
            - Java ${{ env.JAVA_VERSION }}
            - Android SDK ${{ env.ANDROID_COMPILE_SDK }}
            - NDK ${{ env.ANDROID_NDK_VERSION }}

            ### Features:
            - 5 AI Super-Resolution Models (Real-CUGAN + Real-ESRGAN)
            - NCNN Vulkan GPU Acceleration
            - Intelligent Preloading
            - B&W Manga Optimization
            - SR Status Indicator

            ### Build Info:
            - Commit: ${{ github.sha }}
            - Workflow: ${{ github.workflow }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
