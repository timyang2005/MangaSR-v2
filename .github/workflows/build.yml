name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  ANDROID_SDK_ROOT: /opt/android-sdk
  ANDROID_NDK_HOME: /opt/android-sdk/ndk/27.0.12077973
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false'
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and SDK components
        run: |
          export ANDROID_SDK_ROOT=/opt/android-sdk
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "platforms;android-37" "build-tools;37.0.0" 2>&1 || true
          ls -la $ANDROID_SDK_ROOT/ndk/ 2>/dev/null || true

      - name: Download NCNN libraries
        run: |
          set -e
          NCNN_VERSION="20260113"
          NCNN_DIR="core/superresolution/src/main/cpp/ncnn"
          GH_API="https://api.github.com/repos/nihui/ncnn/releases"
          
          mkdir -p ${NCNN_DIR}/lib/arm64-v8a
          mkdir -p ${NCNN_DIR}/lib/armeabi-v7a
          mkdir -p ${NCNN_DIR}/lib/x86_64
          mkdir -p ${NCNN_DIR}/include/ncnn
          
          echo "Downloading NCNN ${NCNN_VERSION} Vulkan Android libraries..."
          
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            echo "Downloading for $ABI..."
            ASSET_URL="https://github.com/nihui/ncnn/releases/download/${NCNN_VERSION}/ncnn-${NCNN_VERSION}-android-vulkan-${ABI}.zip"
            curl -L -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$ASSET_URL" \
              -o "/tmp/ncnn-${ABI}.zip"
            
            if [ -f "/tmp/ncnn-${ABI}.zip" ] && unzip -t "/tmp/ncnn-${ABI}.zip" > /dev/null 2>&1; then
              unzip -q -o "/tmp/ncnn-${ABI}.zip" -d "/tmp/ncnn-${ABI}"
              cp /tmp/ncnn-${ABI}/lib/*.a ${NCNN_DIR}/lib/${ABI}/ 2>/dev/null || true
              ls -la ${NCNN_DIR}/lib/${ABI}/
            else
              echo "Failed to download valid zip for $ABI"
              cat /tmp/ncnn-${ABI}.zip 2>/dev/null | head -1 || echo "Empty file"
            fi
          done
          
          if [ -d "/tmp/ncnn-arm64-v8a" ]; then
            cp -r /tmp/ncnn-arm64-v8a/include/* ${NCNN_DIR}/include/ 2>/dev/null || true
            ls -la ${NCNN_DIR}/include/
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew clean assemble${{ env.BUILD_TYPE }} --no-daemon --info 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          
          echo "=== Build output ==="
          tail -500 build.log
          
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::Build failed with exit code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi
      
      - name: Find APK
        if: success()
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not found!"
            ls -laR app/build 2>/dev/null || true
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"
      
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manga-sr-${{ env.BUILD_TYPE }}-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-ci
          release_name: MangaSR v2.0.0 CI Build
          draft: false
          prerelease: false
          files: ${{ steps.find_apk.outputs.apk_path }}
          body: |
            ## MangaSR v2 - CI Build

            **APK Size**: ${{ steps.find_apk.outputs.apk_size }}

            ### Build Info:
            - Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
