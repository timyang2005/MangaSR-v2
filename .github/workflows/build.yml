name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3072m -Dorg.gradle.daemon=false'
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" --sdk_root=$ANDROID_HOME 2>/dev/null || true
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" --sdk_root=$ANDROID_HOME 2>/dev/null || true
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_HOME 2>/dev/null || true
          echo "Android SDK setup complete"

      - name: Download NCNN Vulkan library
        run: |
          set -e
          NCNN_VERSION="20260112"
          NCNN_DIR="core/superresolution/src/main/cpp/ncnn"
          
          echo "Removing old NCNN files..."
          rm -rf ${NCNN_DIR}
          
          echo "Downloading NCNN ${NCNN_VERSION} Vulkan Android library..."
          mkdir -p ${NCNN_DIR}
          
          for VARIANT in "android-vulkan" "android-vulkan-shared"; do
            URL="https://github.com/nihui/ncnn/releases/download/${NCNN_VERSION}/ncnn-${NCNN_VERSION}-${VARIANT}.zip"
            echo "Trying: ${VARIANT}"
            HTTP_CODE=$(curl -sL -o "/dev/null" -w "%{http_code}" -H "Authorization: token $GITHUB_TOKEN" "${URL}")
            if [ "${HTTP_CODE}" = "302" ] || [ "${HTTP_CODE}" = "200" ]; then
              echo "Found: ${VARIANT} (HTTP ${HTTP_CODE})"
              curl -L -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/octet-stream" \
                "${URL}" \
                -o "/tmp/ncnn-${NCNN_VERSION}.zip"
              break
            else
              echo "Not found: ${VARIANT} (HTTP ${HTTP_CODE})"
            fi
          done
          
          if [ -f "/tmp/ncnn-${NCNN_VERSION}.zip" ]; then
            echo "Downloaded successfully"
            mkdir -p /tmp/_ncnn_extract
            unzip -q "/tmp/ncnn-${NCNN_VERSION}.zip" -d "/tmp/_ncnn_extract"
            
            # Find the extracted ncnn directory
            NCNN_EXTRACTED=$(find /tmp/_ncnn_extract -maxdepth 2 -type d -name "ncnn-*-android-vulkan*" | head -n 1)
            echo "Extracted to: ${NCNN_EXTRACTED}"
            
            if [ -z "${NCNN_EXTRACTED}" ]; then
              echo "ERROR: Could not find extracted ncnn directory"
              ls -la /tmp/_ncnn_extract/
              exit 1
            fi
            
            # Copy everything (libs + headers + cmake)
            cp -r "${NCNN_EXTRACTED}"/* "${NCNN_DIR}/"
            
            # Prebuilt zip has headers inside each ABI folder (arm64-v8a/include/ncnn/...)
            # CMakeLists.txt expects them at ncnn/include/ncnn/...
            # Copy headers from the first available ABI to the expected location
            echo "=== Fixing header location for CMake ==="
            for ABI_DIR in arm64-v8a armeabi-v7a x86_64; do
              if [ -d "${NCNN_DIR}/${ABI_DIR}/include" ]; then
                echo "Copying headers from ${ABI_DIR}/include to include/"
                cp -r "${NCNN_DIR}/${ABI_DIR}/include" "${NCNN_DIR}/include"
                break
              fi
            done
            
            echo "=== NCNN directory structure ==="
            ls -la ${NCNN_DIR}/
            find ${NCNN_DIR} -type f -name "*.a" -o -name "*.h" | head -40
            
            # Verify key headers exist
            echo "=== Verifying headers ==="
            if [ -f "${NCNN_DIR}/include/ncnn/net.h" ]; then
              echo "SUCCESS: net.h found at include/ncnn/net.h"
            else
              echo "WARNING: net.h not found at expected location, listing all .h files..."
              find ${NCNN_DIR} -name "*.h" | head -20
              exit 1
            fi
            
            rm -rf /tmp/_ncnn_extract /tmp/ncnn-${NCNN_VERSION}.zip
          else
            echo "Failed to download NCNN from all variants"
            exit 1
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Debug Gradle wrapper
        run: |
          echo "=== gradle-wrapper.properties ==="
          cat gradle/wrapper/gradle-wrapper.properties
          echo "=== Clearing any cached wrapper dists ==="
          rm -rf ~/.gradle/wrapper/dists/*mirrors* ~/.gradle/wrapper/dists/*tencent* 2>/dev/null || true
          ls -la ~/.gradle/wrapper/dists/ 2>/dev/null || echo "No dists cached"

      - name: Build APK
        run: |
          ./gradlew clean assemble${{ env.BUILD_TYPE }} --max-workers=2 --no-daemon --stacktrace 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== FAILED - Extracting key errors ==="
            grep -n -i "FAILED\|error:\|Error:\|FAILURE\|exception\|cannot find\|undefined\|no member\|e:" build.log | grep -v "^.*:.*warning:" | tail -50 || true
            echo "=== Last 100 lines ==="
            tail -100 build.log
            
            ERROR_SUMMARY=$(grep -i "error:" build.log | head -10 | while read line; do echo "::error::$line"; done)
            echo "$ERROR_SUMMARY"
            
            exit $BUILD_EXIT
          fi
      
      - name: Find APK
        if: success()
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not found!"
            ls -laR app/build 2>/dev/null || true
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"
      
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manga-sr-${{ env.BUILD_TYPE }}-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-ci-${{ github.run_id }}
          name: MangaSR v2.0.0 CI Build #${{ github.run_id }}
          draft: false
          prerelease: true
          files: ${{ steps.find_apk.outputs.apk_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## MangaSR v2 - CI Build

            **APK Size**: ${{ steps.find_apk.outputs.apk_size }}

            ### Build Info:
            - Commit: ${{ github.sha }}
            - Run ID: ${{ github.run_id }}
