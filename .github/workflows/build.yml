name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false'
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK
        run: |
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          
          mkdir -p $ANDROID_HOME/licenses
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e\ne6b7c2ab7fa2298c15165e9583d0acf0b04a2232\n" > $ANDROID_HOME/licenses/android-sdk-license
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          
          echo "=== Android SDK setup complete ==="
          ls -la $ANDROID_HOME/ 2>/dev/null || echo "SDK dir not found"

      - name: Download NCNN Vulkan library
        run: |
          set -e
          NCNN_VERSION="20260112"
          NCNN_DIR="core/superresolution/src/main/cpp/ncnn"
          
          echo "Removing old NCNN files..."
          rm -rf ${NCNN_DIR}
          
          echo "Downloading NCNN ${NCNN_VERSION} Vulkan Android library..."
          mkdir -p ${NCNN_DIR}
          
          curl -L -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://github.com/nihui/ncnn/releases/download/${NCNN_VERSION}/ncnn-${NCNN_VERSION}-android-vulkan.zip" \
            -o "/tmp/ncnn-${NCNN_VERSION}.zip"
          
          if [ -f "/tmp/ncnn-${NCNN_VERSION}.zip" ]; then
            echo "Downloaded successfully"
            unzip -q "/tmp/ncnn-${NCNN_VERSION}.zip" -d "/tmp/ncnn-extract"
            
            NCNN_EXTRACTED=$(find /tmp/ncnn-extract -maxdepth 2 -type d -name "ncnn-*" | head -n 1)
            echo "Extracted to: ${NCNN_EXTRACTED}"
            
            cp -r "${NCNN_EXTRACTED}"/* "${NCNN_DIR}/"
            
            echo "=== NCNN library structure ==="
            ls -la ${NCNN_DIR}/
            find ${NCNN_DIR} -type f -name "*.a" | head -10
            
            rm -rf /tmp/ncnn-extract /tmp/ncnn-${NCNN_VERSION}.zip
          else
            echo "Failed to download NCNN"
            exit 1
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew clean assemble${{ env.BUILD_TYPE }} --no-daemon --info 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          
          echo "=== Build output ==="
          tail -500 build.log
          
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::Build failed with exit code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi
      
      - name: Find APK
        if: success()
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not found!"
            ls -laR app/build 2>/dev/null || true
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"
      
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manga-sr-${{ env.BUILD_TYPE }}-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-ci-${{ github.run_id }}
          release_name: MangaSR v2.0.0 CI Build #${{ github.run_id }}
          draft: false
          prerelease: true
          files: ${{ steps.find_apk.outputs.apk_path }}
          body: |
            ## MangaSR v2 - CI Build

            **APK Size**: ${{ steps.find_apk.outputs.apk_size }}

            ### Build Info:
            - Commit: ${{ github.sha }}
            - Run ID: ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
